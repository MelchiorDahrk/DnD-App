name: Deploy Questlog to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Package production app
    runs-on: ubuntu-latest
    # A full cache miss rendered 4,830 references in 73 minutes on SwiftShader.
    timeout-minutes: 110
    outputs:
      browser-matrix: ${{ steps.browser-matrix.outputs.matrix }}
    permissions:
      contents: read
    env:
      # Keep layout, palette and artwork measurements in the optional visual review.
      # Persistence, interactions, asset loading and offline tests remain required.
      QUESTLOG_VISUAL_CHECKS: '0'
    # Superseded builds can stop without interrupting an active Pages deployment.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install portrait maker dependencies
        run: npm ci
      - name: Check source and deployment runner
        timeout-minutes: 2
        run: |
          npm run check
          node --check scripts/test-deploy.mjs
          node --check scripts/lib/deploy-suites.mjs
      - name: Plan required browser groups
        id: browser-matrix
        run: node scripts/test-deploy.mjs --matrix >> "$GITHUB_OUTPUT"
      - name: Catch rules and browser fixture regressions before building
        # The full rules suite takes over two minutes on GitHub's shared runners.
        timeout-minutes: 5
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Fingerprint portrait rendering dependencies
        id: portrait-inputs
        run: node scripts/portrait-cache-key.mjs >> "$GITHUB_OUTPUT"
      - name: Restore generated portrait assets
        uses: actions/cache/restore@v4
        id: portraits
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-unofficial
            vendor/bricktrait/static/ldraw
            vendor/bricktrait/static/thumbs
            vendor/bricktrait/static/portrait-match-index.json
            .cache/portrait-references
          # Only renderer/geometry sources and their resolved dependency graph.
          # Firebase and unrelated lockfile edits keep this cache key unchanged.
          # Keep paths and old prefixes so existing renders can be migrated safely.
          key: bricktrait-ldraw-f333d939-v5-${{ steps.portrait-inputs.outputs.dependencies }}-${{ hashFiles('equipment-icons.js', 'portrait-image-analysis.js', 'portrait-match.js', 'scripts/build-portrait*.mjs', 'scripts/portrait-cache-key.mjs', 'scripts/lib/portrait-cache.mjs', 'scripts/data/portrait-reference-cache-migrations.json', 'scripts/lib/portrait-themes.mjs', 'scripts/lib/geometry-fingerprint.mjs', 'vendor/bricktrait/scripts/**', 'vendor/bricktrait/src/lib/scene.ts', 'vendor/bricktrait/src/lib/thumb-render.ts', 'vendor/bricktrait/src/lib/thumbs.ts', 'vendor/bricktrait/src/lib/ldraw.ts', 'vendor/bricktrait/src/lib/portrait-scene.ts', 'vendor/bricktrait/src/lib/portrait-glow.ts', 'vendor/bricktrait/src/lib/lighting.ts', 'vendor/bricktrait/src/lib/materials.ts', 'vendor/bricktrait/src/lib/equipment-render.ts', 'vendor/bricktrait/src/lib/fantasy-catalog.js', 'vendor/bricktrait/*catalog.json', 'vendor/bricktrait/presets/legacy-parts.json', 'vendor/bricktrait/presets/legacy-ldraw/**') }}
          restore-keys: |
            bricktrait-ldraw-f333d939-v5-
            bricktrait-ldraw-f333d939-v4-
            bricktrait-ldraw-f333d939-v3-
            bricktrait-ldraw-f333d939-v2-
            bricktrait-ldraw-f333d939-v1
      - name: Restore generated equipment thumbnails
        uses: actions/cache/restore@v4
        id: equipment
        with:
          path: assets/equipment
          # These files are tracked: never overlay a different committed version
          # with a prefix match. Include their content and restore exact hits only.
          key: equipment-${{ steps.portraits.outputs.cache-primary-key }}-${{ hashFiles('assets/equipment/**') }}
      - name: Build static app
        # A full cache miss took 73 minutes for reference rendering on SwiftShader.
        # Warm builds must report "references unchanged" and skip that work.
        timeout-minutes: 100
        run: npm run build
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          QUESTLOG_FIREBASE_CONFIG: ${{ vars.QUESTLOG_FIREBASE_CONFIG }}
      # Save before tests: a later assertion or deploy failure must not discard
      # successful incremental part renders. Exact hits are immutable and need no save.
      - name: Save generated portrait assets
        if: steps.portraits.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-unofficial
            vendor/bricktrait/static/ldraw
            vendor/bricktrait/static/thumbs
            vendor/bricktrait/static/portrait-match-index.json
            .cache/portrait-references
          key: ${{ steps.portraits.outputs.cache-primary-key }}
      - name: Save generated equipment thumbnails
        if: steps.equipment.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/equipment
          key: ${{ steps.equipment.outputs.cache-primary-key }}
      - name: Verify Firebase accounts, rules, offline replay and live parties
        timeout-minutes: 8
        run: npm run test:firebase
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          QUESTLOG_TEST_BUILD: dist
      - name: Upload Firebase failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-failure-diagnostics
          path: |
            .tmp/browser-diagnostics/firebase/
            .tmp/browser-diagnostics/party/
            firestore-debug.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Run tests including generated matching assets
        timeout-minutes: 5
        run: npm test
      - name: Share the production build and generated browser fixtures
        uses: actions/upload-artifact@v4
        with:
          name: production-app
          # Keep the workspace-relative layout, including generated test inputs.
          path: |
            dist/
            portrait-default-data.js
            vendor/bricktrait/preset-catalog.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  browser:
    name: Browser checks (${{ matrix.group }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.browser-matrix) }}
    env:
      QUESTLOG_VISUAL_CHECKS: '0'
    concurrency:
      group: pages-browser-${{ github.ref }}-${{ matrix.group }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - uses: actions/download-artifact@v4
        with:
          name: production-app
      - name: Serve production app under Pages subpath
        timeout-minutes: 1
        run: |
          ln -s dist DnD-App
          node scripts/serve.mjs > /tmp/questlog-server.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:4173/DnD-App/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/questlog-server.log
          exit 1
      - name: Check production interactions, assets and offline behavior
        # Full suites run against the same build on independent machines, keeping
        # SwiftShader sessions from competing for the runner's CPU and memory.
        timeout-minutes: 20
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          DEPLOY_TEST_URL: http://127.0.0.1:4173/DnD-App/
        run: npm run test:deploy -- --group "${{ matrix.group }}"
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics-${{ matrix.group }}
          path: .tmp/browser-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
  build:
    # Preserve the existing required check: success still means every gate passed.
    needs: [package, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the production build and every browser group
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$BROWSER_RESULT" = success
  deploy:
    # A failure in any required group prevents publication of the shared build.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
