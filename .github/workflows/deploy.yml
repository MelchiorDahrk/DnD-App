name: Deploy Questlog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install portrait maker dependencies
        run: npm ci
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-unofficial
            vendor/bricktrait/static/ldraw
          key: bricktrait-ldraw-f333d939-v2-${{ hashFiles('equipment-icons.js', 'vendor/bricktrait/scripts/build-parts.mjs') }}
          restore-keys: |
            bricktrait-ldraw-f333d939-v2-
            bricktrait-ldraw-f333d939-v1
      - name: Check source
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build static app
        run: npm run build
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Browser portrait, equipment, and offline checks under Pages subpath
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          PORTRAIT_TEST_URL: http://127.0.0.1:4173/DnD-App/
          SHEET_TEST_URL: http://127.0.0.1:4173/DnD-App/
        run: |
          ln -s dist DnD-App
          node scripts/serve.mjs > /tmp/questlog-server.log 2>&1 &
          for attempt in 1 2 3 4 5; do curl --silent --fail http://127.0.0.1:4173/DnD-App/ > /dev/null && break; sleep 1; done
          npm run test:portraits
          npm run test:portrait-photos
          npm run test:sheet
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
