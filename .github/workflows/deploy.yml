name: Deploy Questlog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install portrait maker dependencies
        run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-unofficial
            vendor/bricktrait/static/ldraw
          key: bricktrait-ldraw-f333d939-v1
      - name: Check source
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build static app
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
