<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#163b31">
    <meta name="description" content="Your next adventure, in your pocket. A retro 2024 D&D 5e character sheet, inventory, spellbook, dice roller, and adventure journal.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./vfx.css">
    <title>Questlog · Your pocket adventure</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to character</a>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="app-shell">
      <header class="topbar" id="topbar"></header>
      <main id="main" tabindex="-1"></main>
      <footer class="page-footer"><span>A little less bookkeeping. A little more adventure.</span><span>MADE FOR THE TABLE <span class="tiny-spark">✦</span></span></footer>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
    <noscript><div class="noscript">Questlog needs JavaScript to keep your character sheet. Please enable it and reload.</div></noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
